[package]
name = "lagless-android"
version = "0.0.0"
edition = "2021"
publish = false
description = "JNI bridge for the lagless Android app (built with cargo-ndk, packaged by android/app)"

[lib]
name = "lagless_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
lagless = { path = "..", default-features = false, features = ["opus"] }
serde_json = "1"
# Plain crates (no Android-only code), so the bridge also builds on Linux for the JNI test
# harness (android/test-harness).
jni = "0.21"
ndk-context = "0.1"
