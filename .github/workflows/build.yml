name: build
# Every push: test + build. When main carries a Cargo.toml version that has no release yet, CI
# publishes GitHub Release v<version> — which is what installed copies auto-update from.
# So shipping = bump `version` in Cargo.toml and push to main.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  LAGLESS_UPDATE_REPO: ${{ github.repository }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: ./packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Lagless.dmg
            dist/Lagless.dmg.sha256
            dist/Lagless-macos.zip
            dist/Lagless-macos.zip.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - shell: bash
        run: |
          mkdir -p dist
          cp target/release/lagless.exe dist/lagless-windows-x64.exe
          cd dist && sha256sum lagless-windows-x64.exe > lagless-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/lagless-windows-x64.exe*

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version not released yet?
        id: ver
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: lagless ${{ steps.ver.outputs.tag }}
          files: dist/*
          generate_release_notes: true
