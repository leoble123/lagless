name: build
# Every push: test + build. Pushing a tag like v0.2.0: also publish a GitHub Release, which is
# what installed copies auto-update from.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  LAGLESS_UPDATE_REPO: ${{ github.repository }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: ./packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Lagless.dmg
            dist/Lagless.dmg.sha256
            dist/Lagless-macos.zip
            dist/Lagless-macos.zip.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - shell: bash
        run: |
          mkdir -p dist
          cp target/release/lagless.exe dist/lagless-windows-x64.exe
          cd dist && sha256sum lagless-windows-x64.exe > lagless-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/lagless-windows-x64.exe*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Cargo.toml is $v but tag is ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
