[package]
name = "lagless"
version = "0.8.1"
edition = "2021"
description = "Ultra-low-latency PC-to-Mac audio streaming over Wi-Fi, Ethernet, USB or Bluetooth"

[lib]
name = "lagless"
path = "src/lib.rs"

[[bin]]
name = "lagless"
path = "src/main.rs"

[workspace]
members = [".", "android"]
default-members = ["."]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
rtrb = "0.3"
socket2 = "0.5"
if-addrs = "0.13"
opus = { version = "0.3", optional = true }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
self-replace = "1.5.0"
nnnoiseless = { version = "0.5.2", default-features = false }
rustfft = "6"

[features]
default = ["opus"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"

# Desktop-only eframe features: accesskit (screen readers) isn't supported with Android's
# NativeActivity, and x11 is the Linux windowing backend.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "x11"] }

[target.'cfg(windows)'.dependencies]
# Same version cpal already builds, so this adds no compile time.
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"
